<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Симулятор болида F1 с ERS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: #f5f5f5;
  }
  h1 { color: #222; font-size: 22px; }
  .panel {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  .row { display: flex; align-items: center; margin: 8px 0; }
  .row label { width: 220px; font-size: 15px; }
  .row input {
    flex: 1;
    padding: 8px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  button {
    background: #d32f2f;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
  }
  button:hover { background: #b71c1c; }
  .results { font-size: 16px; line-height: 1.8; }
  .results b { color: #d32f2f; }
  canvas { max-height: 350px; }
</style>
</head>
<body>

<h1>🏎️ Симулятор разгона болида F1 с рекуперацией (ERS)</h1>

<div class="panel">
  <div class="row">
    <label>Масса болида (кг):</label>
    <input type="number" id="mass" value="798" step="1">
  </div>
  <div class="row">
    <label>Мощность ДВС (л.с.):</label>
    <input type="number" id="powerIce" value="750" step="10">
  </div>
  <div class="row">
    <label>Мощность ERS (л.с.):</label>
    <input type="number" id="powerErs" value="160" step="10">
  </div>
  <div class="row">
    <label>Коэффициент трения (μ):</label>
    <input type="number" id="mu" value="1.7" step="0.1">
  </div>
  <button onclick="runSimulation()">Запустить симуляцию</button>
</div>

<div class="panel">
  <div class="results" id="results">Нажмите «Запустить симуляцию»</div>
</div>

<div class="panel">
  <canvas id="speedChart"></canvas>
</div>

<div class="panel">
  <canvas id="ersChart"></canvas>
</div>

<script>
// ---------- Физика симуляции ----------
function simulate(useErs, mass, powerIceHp, powerErsHp, mu) {
  const powerIce = powerIceHp * 735.5;
  const powerErs = powerErsHp * 735.5;
  const cdA = 1.5;
  const rho = 1.225;
  const dt = 0.01;
  const tMax = 60;

  let v = 0, t = 0, ersCharge = 4000000, lapTime = 0, energyReturned = 0;
  const timeData = [], speedData = [], ersData = [];

  const phases = [
    [2.0, 'accel'], [1.0, 'brake'], [1.0, 'corner'],
    [2.0, 'accel'], [1.0, 'brake'], [1.0, 'corner'],
    [2.0, 'accel']
  ];
  let phaseIndex = 0, phaseTimeLeft = phases[0][0], mode = phases[0][1];

  while (t < tMax) {
    let fIce;
    if (v > 0.5) fIce = powerIce / v;
    else fIce = 12000;

    let fErs = 0;
    if (useErs && mode === 'accel' && ersCharge > 0 && v > 0.5 && v < 55) {
      fErs = powerErs / v;
    }

    const fMaxGrip = mu * mass * 9.81;
    const fTraction = Math.min(fIce + fErs, fMaxGrip);
    const fDrag = 0.5 * rho * cdA * v * v;
    const fRolling = 0.015 * mass * 9.81;

    let fNet;
    if (mode === 'brake') {
      const fBrake = 15000;
      fNet = -fBrake - fDrag - fRolling;
      if (useErs) {
        const recovered = Math.min(powerErs, Math.abs(fBrake * v));
        ersCharge = Math.min(ersCharge + recovered * dt, 4000000);
        energyReturned += recovered * dt;
      }
    } else if (mode === 'corner') {
      const target = 25;
      fNet = v > target ? (-8000 - fDrag - fRolling) : 0;
    } else {
      fNet = fTraction - fDrag - fRolling;
    }

    const a = fNet / mass;
    v = Math.max(v + a * dt, 0);
    t += dt;
    lapTime += dt;

    if (fErs > 0) {
      ersCharge = Math.max(ersCharge - powerErs * dt, 0);
    }

    timeData.push(t);
    speedData.push(v * 3.6);
    ersData.push(ersCharge / 1000);

    phaseTimeLeft -= dt;
    if (phaseTimeLeft <= 0) {
      phaseIndex++;
      if (phaseIndex >= phases.length) break;
      phaseTimeLeft = phases[phaseIndex][0];
      mode = phases[phaseIndex][1];
    }
  }

  return { timeData, speedData, ersData, lapTime, energyReturned };
}

// ---------- Построение графиков ----------
let speedChart = null;
let ersChart = null;

function runSimulation() {
  const mass = parseFloat(document.getElementById('mass').value) || 798;
  const powerIce = parseFloat(document.getElementById('powerIce').value) || 750;
  const powerErs = parseFloat(document.getElementById('powerErs').value) || 160;
  const mu = parseFloat(document.getElementById('mu').value) || 1.7;

  const withErs = simulate(true, mass, powerIce, powerErs, mu);
  const withoutErs = simulate(false, mass, powerIce, powerErs, mu);

  // Результаты
  const diff = withoutErs.lapTime - withErs.lapTime;
  document.getElementById('results').innerHTML = `
    Время круга <b>С ERS</b>: ${withErs.lapTime.toFixed(2)} с<br>
    Время круга <b>БЕЗ ERS</b>: ${withoutErs.lapTime.toFixed(2)} с<br>
    Выигрыш от ERS: <b>${diff.toFixed(2)} с</b><br>
    Энергия, возвращённая в батарею: <b>${(withErs.energyReturned / 1000).toFixed(1)} кДж</b>
  `;

  // График скорости
  if (speedChart) speedChart.destroy();
  speedChart = new Chart(document.getElementById('speedChart'), {
    type: 'line',
    data: {
      labels: withErs.timeData.map(t => t.toFixed(1)),
      datasets: [
        {
          label: 'С ERS',
          data: withErs.speedData,
          borderColor: 'blue',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.1
        },
        {
          label: 'Без ERS',
          data: withoutErs.speedData,
          borderColor: 'gray',
          borderWidth: 2,
          borderDash: [5, 5],
          pointRadius: 0,
          tension: 0.1
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        title: { display: true, text: 'Скорость болида на круге (км/ч)' }
      },
      scales: {
        x: { title: { display: true, text: 'Время (с)' } },
        y: { title: { display: true, text: 'Скорость (км/ч)' } }
      }
    }
  });

  // График заряда ERS
  if (ersChart) ersChart.destroy();
  ersChart = new Chart(document.getElementById('ersChart'), {
    type: 'line',
    data: {
      labels: withErs.timeData.map(t => t.toFixed(1)),
      datasets: [{
        label: 'Заряд ERS',
        data: withErs.ersData,
        borderColor: 'red',
        borderWidth: 2,
        pointRadius: 0,
        fill: false,
        tension: 0.1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        title: { display: true, text: 'Энергия в системе рекуперации (кДж)' }
      },
      scales: {
        x: { title: { display: true, text: 'Время (с)' } },
        y: { title: { display: true, text: 'Заряд (кДж)' } }
      }
    }
  });
}
</script>

</body>
</html>
